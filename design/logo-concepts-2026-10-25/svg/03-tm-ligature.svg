<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Tatsi in motion — TM Ligature</title>
  <desc id="logo-description">Точная монограмма с общим наклоном. Прямая T отвечает за силу, раскрытая M — за движение. Transparent background; editable vector shapes; white #ffffff and mint #bcf7f3.</desc>
  <g id="03-tm-ligature-artwork">
    <path id="t-top" d="M125 166 H290" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="t-stem" d="M213 166 L165 351" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="m" d="M234 351 L277 188 L302 279 L378 188 L335 351" fill="none" stroke="#bcf7f3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
