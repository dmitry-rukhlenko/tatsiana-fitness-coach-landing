<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Tatsi in motion — Swing T</title>
  <!-- Crossbar: arc of a circle r=173.3 (chord 176, rise 24). Stem drops from the apex. Mint dot = the moving end of the swing. -->
  <g id="symbol" fill="none" stroke-linecap="round">
    <path id="crossbar" d="M40 84 A173.3 173.3 0 0 1 216 84" stroke="#ffffff" stroke-width="24"/>
    <path id="stem" d="M128 60 V196" stroke="#ffffff" stroke-width="24"/>
    <circle id="dot" cx="216" cy="84" r="18" fill="#bcf7f3" stroke="none"/>
  </g>
</svg>
