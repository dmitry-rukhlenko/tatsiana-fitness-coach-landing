<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Tatsi in motion — Open Reach</title>
  <desc id="logo-description">Раскрытая фигура без спортивной агрессии. Акцент на подвижности и ощущении своего тела. Transparent background; editable vector shapes; white #ffffff and mint #bcf7f3.</desc>
  <g id="02-open-reach-artwork">
