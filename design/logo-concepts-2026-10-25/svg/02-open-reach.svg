    <path id="open-arms" d="M137 193 C209 235 278 225 359 161" fill="none" stroke="#ffffff" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="body-and-grounded-leg" d="M260 220 C247 275 216 333 170 376" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="moving-leg" d="M239 282 C284 305 305 344 338 371" fill="none" stroke="#bcf7f3" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
